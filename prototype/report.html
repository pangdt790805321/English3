<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>检查报告 · EHS-AI</title>
<link rel="stylesheet" href="app.css">
<style>
  @media print{
    body{background:#fff}
    .appbar,.action-bar,.tabbar,.seg,#noPrint,.foot-note{display:none !important}
    .app{box-shadow:none;max-width:100%;padding-bottom:0}
    .doc{border:none;padding:0}
  }
</style>
<script src="../analytics-config.js"></script>
<script src="tracker.js"></script>
</head>
<body>
<div class="app">

  <header class="appbar">
    <a class="back" href="result.html">‹</a>
    <h1>检查报告</h1>
    <span class="pack">真实数据生成</span>
  </header>

  <main class="page">
    <div id="docCn"></div>

    <div class="sec-head" id="noPrint"><h2>导出</h2></div>
    <section class="card" style="display:grid;gap:10px" id="noPrint2">
      <button class="btn btn-primary btn-block" onclick="window.print()">🖨️ 打印 / 导出 PDF</button>
      <p style="font-size:12px;color:var(--ink-soft);text-align:center">
        浏览器打印对话框中选择"另存为 PDF"即可导出文件 · 数据来自本机真实检查记录
      </p>
    </section>
  </main>

  <div class="action-bar" >
    <a class="btn btn-ghost" href="result.html">‹ 返回结果</a>
    <a class="btn btn-primary" href="log.html">查看隐患台账 →</a>
  </div>

<script src="app.js?v=201"></script>
<script>
const ins = DB.currentInspection();
const hazards = (ins ? ins.hazards.map(id=>DB.hazard(id)).filter(Boolean) : []);
const RN = { high:'高', medium:'中', low:'低', review:'待定' };
const SN = { todo:'待整改', doing:'整改中', check:'待复查', done:'已闭环' };
const no = 'EHS-' + (ins ? ins.date.replace(/-/g,'') : todayISO().replace(/-/g,'')) + '-' + String(DB.inspections().length).padStart(2,'0');

const rows = hazards.map((h,i)=>`
  <tr><td>${i+1}</td><td>${esc(h.desc)}</td><td>${RN[h.risk]||'待定'}</td>
  <td>${h.citation ? esc(h.citation.std)+(h.citation.clause?' §'+esc(h.citation.clause):'') : '—'}</td>
  <td>${h.ddl ? h.ddl.slice(5) : '—'}</td><td>${esc(h.owner||'—')}</td><td>${SN[h.status]}</td></tr>`).join('');

function emptyHint(){
  return `<section class="card" style="text-align:center;padding:34px 16px;color:var(--ink-soft)">
    当前检查任务暂无隐患，报告将只有概况。<br>
    <a class="btn btn-primary btn-sm" style="margin-top:14px" href="scan.html">去登记隐患</a>
  </section>`;
}

document.getElementById('docCn').innerHTML = hazards.length ? `
<section class="doc">
  <div class="doc-head">
    <h2>安全检查报告</h2>
    <div class="no">编号：${no} · EHS-AI 平台生成</div>
  </div>
  <div class="meta">
    <div><b>检查名称：</b><span>${esc(ins.title)}</span></div>
    <div><b>检查人：</b><span>${esc(ins.inspector)}</span></div>
    <div><b>日期：</b><span>${ins.date}</span></div>
    <div><b>检查模式：</b><span>${esc(ins.mode||'综合')}</span></div>
  </div>
  <h4>一、检查概况</h4>
  <p>本次检查共登记隐患 ${hazards.length} 项，其中高风险 ${hazards.filter(h=>h.risk==='high').length} 项、中风险 ${hazards.filter(h=>h.risk==='medium').length} 项、低风险 ${hazards.filter(h=>h.risk==='low').length} 项、待人工复核 ${hazards.filter(h=>h.risk==='review').length} 项。</p>
  <h4>二、隐患清单</h4>
  <table>
    <tr><th>#</th><th>隐患描述</th><th>等级</th><th>依据条文</th><th>期限</th><th>责任人</th><th>状态</th></tr>
    ${rows}
  </table>
  <h4>三、整改要求</h4>
  <p>高风险隐患应立即停止相关作业并优先整改；各隐患在台账中跟踪，整改完成后经复查销项闭环。AI 生成的条文引用需核对官方文本后方可对外使用。</p>
  <div class="sign"><div>检查人签字</div><div>被检查单位负责人</div></div>
</section>` : emptyHint();

function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</div>
</body>
</html>
