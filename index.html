<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>英语闯关 · 三年级上册</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
     background:linear-gradient(170deg,#eef4ff,#fff7ee 60%,#f3f0ff);min-height:100vh;color:#233}
#app{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:21px;margin:6px 0 2px;text-align:center}
.sub{text-align:center;color:#7b8794;font-size:13px;margin-bottom:14px}
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 18px rgba(60,90,160,.10);margin-bottom:12px}
.island{display:flex;align-items:center;gap:12px}
.island .ico{font-size:30px;width:46px;text-align:center}
.island .t1{font-weight:700;font-size:16px}
.island .t2{font-size:12px;color:#8390a0;margin-top:2px}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
.lv{position:relative;border-radius:14px;padding:9px 4px;text-align:center;background:#eef3ff;
    border:2px solid transparent;cursor:pointer;transition:.15s}
.lv:active{transform:scale(.95)}
.lv .n{font-size:15px;font-weight:700}
.lv .nm{font-size:10px;color:#7b8794;margin-top:3px;line-height:1.2;height:24px;overflow:hidden}
.lv .st{font-size:11px;letter-spacing:1px;color:#f5b400;margin-top:2px;height:14px}
.lv.lock{background:#f1f2f4;color:#b9c0c9;cursor:not-allowed}
.lv.lock .nm,.lv.lock .st{color:#c8cdd4}
.lv.done{background:#e8fbef;border-color:#b6ecc9}
.lv.boss{grid-column:span 4;background:linear-gradient(95deg,#fff3e0,#ffe3e3);text-align:left;padding:12px 14px}
.lv.boss .nm{height:auto;font-size:12px}
.lv.boss .st{text-align:right;margin-top:-14px}
.lv.listen{background:linear-gradient(95deg,#e8f0ff,#f0e8ff)}
/* 答题 */
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.btn-back{background:#fff;border:none;border-radius:12px;padding:9px 13px;font-size:14px;
          box-shadow:0 2px 8px rgba(60,90,160,.12);cursor:pointer}
.bar{flex:1;height:9px;background:#e6ebf3;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#5b9dff,#7bd3a8);width:0;transition:.3s}
.cnt{font-size:13px;color:#7b8794;white-space:nowrap}
.qtag{display:inline-block;font-size:11px;background:#eef3ff;color:#5b7fbf;border-radius:8px;padding:3px 9px;margin-bottom:10px}
.stem{font-size:20px;font-weight:600;line-height:1.5;margin:4px 0 16px;word-break:break-word}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:11px;background:#f7f9fd;border:2px solid #e7ecf5;border-radius:15px;
     padding:14px;font-size:17px;cursor:pointer;transition:.15s;text-align:left}
.opt:active{transform:scale(.985)}
.opt .k{width:26px;height:26px;border-radius:50%;background:#dde6f5;color:#4b6a9e;
        display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:0 0 26px}
.opt.right{background:#e8fbef;border-color:#7bd3a8}
.opt.right .k{background:#7bd3a8;color:#fff}
.opt.wrong{background:#ffeceb;border-color:#ff9b94}
.opt.wrong .k{background:#ff9b94;color:#fff}
.opt.dim{opacity:.5}
.tip{margin-top:14px;border-radius:14px;padding:13px;font-size:14px;line-height:1.6;display:none}
.tip.ok{background:#e8fbef;color:#1e7a4b}
.tip.no{background:#ffeceb;color:#a33}
.play{display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(95deg,#5b9dff,#7b8cff);
      color:#fff;border:none;border-radius:16px;padding:18px;font-size:18px;font-weight:700;cursor:pointer;width:100%;
      box-shadow:0 6px 16px rgba(91,157,255,.35)}
.play:active{transform:scale(.98)}
.big{display:block;width:100%;margin-top:16px;padding:16px;border:none;border-radius:16px;font-size:17px;
     font-weight:700;background:#5b9dff;color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(91,157,255,.3)}
.big.gray{background:#e9eef6;color:#5d6b7d;box-shadow:none}
.big:active{transform:scale(.98)}
/* 结算 */
.stars{font-size:46px;text-align:center;letter-spacing:6px;color:#f5b400;margin:8px 0}
.rate{text-align:center;font-size:15px;color:#5d6b7d;margin-bottom:6px}
.wrongbox{background:#fff8f8;border-radius:14px;padding:12px;font-size:14px;line-height:1.7;margin-top:10px}
.wrongbox b{color:#a33}
/* 徽章 */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bd{border-radius:16px;padding:12px 6px;text-align:center;background:#f3f5f9;color:#b9c0c9;font-size:12px}
.bd .i{font-size:28px;display:block;margin-bottom:4px;filter:grayscale(1);opacity:.45}
.bd.on{background:linear-gradient(160deg,#fff6e0,#fff);color:#8a6b1f;box-shadow:0 4px 14px rgba(240,180,0,.25)}
.bd.on .i{filter:none;opacity:1}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;text-align:center;padding:10px;border-radius:13px;background:#fff;font-size:14px;color:#5d6b7d;cursor:pointer;
     box-shadow:0 2px 8px rgba(60,90,160,.10)}
.tab.on{background:#5b9dff;color:#fff;font-weight:700}
.row{display:flex;justify-content:space-between;padding:9px 2px;font-size:14px;border-bottom:1px dashed #eef1f6}
.row:last-child{border:none}
.muted{color:#98a2b3;font-size:13px;text-align:center;padding:18px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = {"units":[{"unit":1,"name":"Making friends","cn":"交朋友","levels":[{"no":1,"name":"打招呼小勇士","count":8,"part":"A Let's talk"},{"no":2,"name":"字母探险 A~D","count":6,"part":"A Letters and sounds"},{"no":3,"name":"分享与帮助","count":8,"part":"B Let's talk / Let's learn"},{"no":4,"name":"好朋友宣言","count":8,"part":"C Start to read"},{"no":5,"name":"故事时间","count":6,"part":"C Reading time"},{"no":6,"name":"Unit 1 Boss","count":20,"part":"全单元"}],"questions":[{"id":"U1-L1-Q01","level":1,"type":"single","stem":"Mike 说：Hello! I'm Mike Black. 你也想介绍自己，你说：","options":["Goodbye!","Hello! I'm ...","Oh no!"],"answer":"B","explain":"打招呼 + 自我介绍用 Hello! I'm ...","tags":["问候"]},{"id":"U1-L1-Q02","level":1,"type":"judge","stem":"Nice to meet you. 是第一次见到朋友时说的话。","options":["对","错"],"answer":"对","explain":"Nice to meet you. = 见到你很高兴","tags":["问候"]},{"id":"U1-L1-Q03","level":1,"type":"single","stem":"别人说：Nice to meet you. 你应该说：","options":["My name is Zip.","It's OK.","Nice to meet you too."],"answer":"C","explain":"回答要加 too，表示“我也很高兴见到你”","tags":["问候"]},{"id":"U1-L1-Q04","level":1,"type":"judge","stem":"Hi! My name is Wu Binbin. 是在介绍自己的名字。","options":["对","错"],"answer":"对","explain":"My name is ... = 我叫……","tags":["自我介绍"]},{"id":"U1-L1-Q05","level":1,"type":"single","stem":"Hi! ____ John.","options":["I'm","name","nice"],"answer":"A","explain":"Hi! I'm John. = 你好！我是约翰。","tags":["自我介绍"]},{"id":"U1-L1-Q06","level":1,"type":"judge","stem":"Goodbye! 和 Hello! 都可以用来打招呼。","options":["对","错"],"answer":"错","explain":"Goodbye! 是“再见”，打招呼用 Hello! / Hi!","tags":["问候"]},{"id":"U1-L1-Q07","level":1,"type":"single","stem":"Sarah 说：Hello! My name is Sarah. 她想告诉你：","options":["她七岁了","她喜欢苹果","她叫 Sarah"],"answer":"C","explain":"My name is ... 是在说名字","tags":["自我介绍"]},{"id":"U1-L1-Q08","level":1,"type":"single","stem":"想问别人叫什么名字，你说：","options":["Nice to meet you.","What's your name?","Let's play a game!"],"answer":"B","explain":"What's your name? = 你叫什么名字？","tags":["询问名字"]},{"id":"U1-L2-Q01","level":2,"type":"single","stem":"字母 A 的小写是","options":["c","d","a"],"answer":"C","explain":"A 的小写是 a","tags":["字母"]},{"id":"U1-L2-Q02","level":2,"type":"judge","stem":"字母 B 排在 A 的后面。","options":["对","错"],"answer":"对","explain":"顺序是 A B C D","tags":["字母"]},{"id":"U1-L2-Q03","level":2,"type":"single","stem":"apple（苹果）的第一个字母是","options":["b","a","c"],"answer":"B","explain":"apple 以 a 开头","tags":["字母","发音"]},{"id":"U1-L2-Q04","level":2,"type":"judge","stem":"字母 D 的小写是 b。","options":["对","错"],"answer":"错","explain":"D 的小写是 d，b 是 B 的小写","tags":["字母"]},{"id":"U1-L2-Q05","level":2,"type":"single","stem":"Aa  Bb  ____  Dd，横线上是","options":["Ee","Ff","Cc"],"answer":"C","explain":"字母顺序 A B C D","tags":["字母"]},{"id":"U1-L2-Q06","level":2,"type":"judge","stem":"字母 C 的小写是 e。","options":["对","错"],"answer":"错","explain":"C 的小写是 c","tags":["字母"]},{"id":"U1-L3-Q01","level":3,"type":"single","stem":"Chen Jie 没有彩笔，Sarah 说：We can ____.","options":["share","listen","say"],"answer":"A","explain":"We can share. = 我们可以分享。","tags":["分享"]},{"id":"U1-L3-Q02","level":3,"type":"judge","stem":"share 的意思是“分享”。","options":["对","错"],"answer":"对","explain":"share = 分享","tags":["词汇"]},{"id":"U1-L3-Q03","level":3,"type":"single","stem":"歌谣：I ____ and say 'Hi!' I smile too.","options":["share","listen","help"],"answer":"B","explain":"listen = 听；倾听","tags":["歌谣"]},{"id":"U1-L3-Q04","level":3,"type":"single","stem":"smile 的意思是","options":["说话","微笑","听"],"answer":"B","explain":"smile = 微笑；笑","tags":["词汇"]},{"id":"U1-L3-Q05","level":3,"type":"judge","stem":"help 的意思是“分享”。","options":["对","错"],"answer":"错","explain":"help 是帮助，分享是 share","tags":["词汇"]},{"id":"U1-L3-Q06","level":3,"type":"single","stem":"同学帮你捡起了铅笔，你应该说：","options":["Goodbye.","Thank you.","Oh no!"],"answer":"B","explain":"别人帮忙后要说 Thank you.","tags":["礼貌用语"]},{"id":"U1-L3-Q07","level":3,"type":"judge","stem":"It's OK. 可以在别人不小心碰倒东西、说 sorry 的时候用来安慰他。","options":["对","错"],"answer":"对","explain":"It's OK. = 没关系。","tags":["礼貌用语"]},{"id":"U1-L3-Q08","level":3,"type":"single","stem":"歌谣：I help and share. I ____ fair too.","options":["play","say","smile"],"answer":"A","explain":"play fair = 公平地玩","tags":["歌谣"]},{"id":"U1-L4-Q01","level":4,"type":"single","stem":"海报上写：I say 'Hi!' I ____.","options":["arm","eye","listen"],"answer":"C","explain":"I listen. = 我倾听。","tags":["阅读"]},{"id":"U1-L4-Q02","level":4,"type":"single","stem":"eye 的意思是","options":["嘴","耳朵","眼睛"],"answer":"C","explain":"eye = 眼睛","tags":["词汇"]},{"id":"U1-L4-Q03","level":4,"type":"judge","stem":"ear 的意思是“耳朵”。","options":["对","错"],"answer":"对","explain":"ear = 耳朵","tags":["词汇"]},{"id":"U1-L4-Q04","level":4,"type":"single","stem":"mouth 的意思是","options":["手","胳膊","嘴"],"answer":"C","explain":"mouth = 嘴","tags":["词汇"]},{"id":"U1-L4-Q05","level":4,"type":"single","stem":"hand 的意思是","options":["胳膊","眼睛","手"],"answer":"C","explain":"hand = 手","tags":["词汇"]},{"id":"U1-L4-Q06","level":4,"type":"judge","stem":"arm 的意思是“腿”。","options":["对","错"],"answer":"错","explain":"arm 是胳膊，腿是 leg","tags":["词汇"]},{"id":"U1-L4-Q07","level":4,"type":"single","stem":"say 的意思是","options":["听","分享","说"],"answer":"C","explain":"say = 说；讲","tags":["词汇"]},{"id":"U1-L4-Q08","level":4,"type":"judge","stem":"I am nice to my friend! 的意思是“我要和朋友说再见”。","options":["对","错"],"answer":"错","explain":"意思是“我对我的朋友很友好”","tags":["阅读"]},{"id":"U1-L5-Q01","level":5,"type":"judge","stem":"故事里 Zip 和 Zoom 是一家人。","options":["对","错"],"answer":"错","explain":"他们是新认识的好朋友（new friend）","tags":["故事"]},{"id":"U1-L5-Q02","level":5,"type":"single","stem":"Zoom 说：My name is Zoom. Nice to meet you ____.","options":["too","to","two"],"answer":"A","explain":"Nice to meet you too. 表示“我也很高兴见到你”","tags":["故事"]},{"id":"U1-L5-Q03","level":5,"type":"single","stem":"Zip 和 Zoom 一起做了什么？","options":["share food","play football","say goodbye"],"answer":"A","explain":"We share food. = 我们分享食物。","tags":["故事"]},{"id":"U1-L5-Q04","level":5,"type":"judge","stem":"This is my new friend. 的意思是“这是我的新朋友”。","options":["对","错"],"answer":"对","explain":"new friend = 新朋友","tags":["故事"]},{"id":"U1-L5-Q05","level":5,"type":"single","stem":"friend 的意思是","options":["朋友","老师","家人"],"answer":"A","explain":"friend = 朋友","tags":["词汇"]},{"id":"U1-L5-Q06","level":5,"type":"judge","stem":"Zoom is nice. 的意思是“Zoom 很友好”。","options":["对","错"],"answer":"对","explain":"nice = 友好的","tags":["故事"]},{"id":"U1-L6-Q01","level":6,"type":"single","stem":"第一次见面，正确的说法是","options":["It's OK.","Nice to meet you.","Oh no!"],"answer":"B","explain":"初次见面用 Nice to meet you.","tags":["Boss"]},{"id":"U1-L6-Q02","level":6,"type":"judge","stem":"name 的意思是“名字”。","options":["对","错"],"answer":"对","explain":"name = 名字","tags":["Boss"]},{"id":"U1-L6-Q03","level":6,"type":"single","stem":"选出不同类的一项","options":["ear","eye","name"],"answer":"C","explain":"eye、ear 是身体部位，name 不是","tags":["Boss"]},{"id":"U1-L6-Q04","level":6,"type":"single","stem":"good 的意思是","options":["名字","好的","分享"],"answer":"B","explain":"good = 好的","tags":["Boss"]},{"id":"U1-L6-Q05","level":6,"type":"judge","stem":"can 的意思是“分享”。","options":["对","错"],"answer":"错","explain":"can 是可以；分享是 share","tags":["Boss"]},{"id":"U1-L6-Q06","level":6,"type":"single","stem":"同学说：Nice to meet you. 你回答","options":["Nice to meet you too.","Oh no!","Thank you."],"answer":"A","explain":"一定要加 too","tags":["Boss"]},{"id":"U1-L6-Q07","level":6,"type":"single","stem":"字母顺序 A B ____ D","options":["C","F","E"],"answer":"A","explain":"A B C D","tags":["Boss"]},{"id":"U1-L6-Q08","level":6,"type":"single","stem":"怎样才算一个好伙伴？","options":["I help and share.","I say goodbye.","Oh no!"],"answer":"A","explain":"帮助和分享才是好朋友","tags":["Boss"]},{"id":"U1-L6-Q09","level":6,"type":"judge","stem":"smile 的意思是“说”。","options":["对","错"],"answer":"错","explain":"smile 是微笑，say 才是说","tags":["Boss"]},{"id":"U1-L6-Q10","level":6,"type":"single","stem":"listen 的意思是","options":["听；倾听","说；讲","微笑"],"answer":"A","explain":"listen = 听；倾听","tags":["Boss"]},{"id":"U1-L6-Q11","level":6,"type":"single","stem":"____ your name?","options":["What","What's","How"],"answer":"B","explain":"What's your name? = 你叫什么名字？","tags":["Boss"]},{"id":"U1-L6-Q12","level":6,"type":"judge","stem":"hand 的意思是“手”。","options":["对","错"],"answer":"对","explain":"hand = 手","tags":["Boss"]},{"id":"U1-L6-Q13","level":6,"type":"single","stem":"选出不同类的一项","options":["mouth","arm","share"],"answer":"C","explain":"mouth、arm 是身体部位，share 不是","tags":["Boss"]},{"id":"U1-L6-Q14","level":6,"type":"single","stem":"朋友把玩具分给你，你说","options":["Oh no!","Thank you.","My name is ..."],"answer":"B","explain":"得到帮助或礼物要道谢","tags":["Boss"]},{"id":"U1-L6-Q15","level":6,"type":"judge","stem":"friend 的意思是“老师”。","options":["对","错"],"answer":"错","explain":"friend 是朋友","tags":["Boss"]},{"id":"U1-L6-Q16","level":6,"type":"single","stem":"字母 D 的小写是","options":["a","d","b"],"answer":"B","explain":"D 的小写是 d","tags":["Boss"]},{"id":"U1-L6-Q17","level":6,"type":"single","stem":"I say 'Hi!' I ____. I share.","options":["listen","good","name"],"answer":"A","explain":"听、分享都是好朋友的做法","tags":["Boss"]},{"id":"U1-L6-Q18","level":6,"type":"judge","stem":"ear 的意思是“眼睛”。","options":["对","错"],"answer":"错","explain":"ear 是耳朵，eye 才是眼睛","tags":["Boss"]},{"id":"U1-L6-Q19","level":6,"type":"single","stem":"We can ____. 表示“我们可以分享”。","options":["smile","share","say"],"answer":"B","explain":"share = 分享","tags":["Boss"]},{"id":"U1-L6-Q20","level":6,"type":"judge","stem":"“我是一个好朋友！”英文是 I am a good friend!","options":["对","错"],"answer":"对","explain":"I am a good friend! = 我是一个好朋友！","tags":["Boss"]}]},{"unit":2,"name":"Different families","cn":"不同的家庭","levels":[{"no":1,"name":"谁和你住一起","count":8,"part":"A Let's talk / 手指家族歌"},{"no":2,"name":"我家的家庭树","count":8,"part":"B Let's learn / Listen and chant"},{"no":3,"name":"字母探险 E~H","count":6,"part":"B Letters and sounds"},{"no":4,"name":"家谱大挑战","count":8,"part":"C Project"},{"no":5,"name":"阅读时间","count":6,"part":"C Reading time"},{"no":6,"name":"Unit 2 Boss","count":20,"part":"全单元"}],"questions":[{"id":"U2-L1-Q01","level":1,"type":"single","stem":"想把妈妈介绍给朋友，你说：","option /* ---------- 状态 ---------- */
const KEY = 'eng3prog_v1';
let S = load();
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {} }catch(e){ return {} } }
function save(){ localStorage.setItem(KEY, JSON.stringify(S)) }
S.stars = S.stars || {}; S.badges = S.badges || []; S.wrong = S.wrong || {}; S.days = S.days || [];

/* ---------- 单元数据 ---------- */
const UNITS = DATA.units;                       // [{unit,name,cn,levels:[{no,name,count,part}],questions:[]}]
const LISTEN = DATA.listening;                  // [{unit, name, questions:[]}]
function levelsOf(u){
  const U = UNITS.find(x => x.unit === u);
  const L = LISTEN.find(x => x.unit === u);
  return U.levels.map(l => ({...l, kind:'quiz', unit:u}))
        .concat(L ? [{no:99, name:L.name, count:L.questions.length, kind:'listen', unit:u}] : []);
}
function questionsOf(u, no){
  if (no === 99){ const L = LISTEN.find(x => x.unit === u); return L ? L.questions : [] }
  return UNITS.find(x => x.unit === u).questions.filter(q => q.level === no);
}
const key = (u, no) => u + '-' + no;

/* ---------- 徽章 ---------- */
const BADGES = [
  {id:'b_u1', i:'🤝', n:'交友达人'}, {id:'b_u2', i:'👨‍👩‍👧', n:'家人小能手'},
  {id:'b_u3', i:'🐼', n:'动物好朋友'}, {id:'b_u4', i:'🌱', n:'植物小园丁'},
  {id:'b_u5', i:'🎨', n:'颜色魔法师'}, {id:'b_u6', i:'🔢', n:'数字小能手'},
  {id:'b_listen', i:'🎧', n:'听力小达人'}, {id:'b_perfect', i:'⭐', n:'完美主义'},
  {id:'b_fixall', i:'🧹', n:'错题终结者'}, {id:'b_streak', i:'🔥', n:'一周不断更'},
  {id:'b_all', i:'🏆', n:'英语小勇士'},
];
function grant(id){ if(!S.badges.includes(id)){ S.badges.push(id); save(); return true } return false }

/* ---------- 工具 ---------- */
/* 正确答案 -> 选项下标。兼容两种数据写法：选择题的 "A/B/C" 和判断题的 "对/错" */
function ansIdx(q){
  const a = q.answer;
  if (a === '对') return 0;
  if (a === '错') return 1;
  const i = 'ABC'.indexOf(a);
  return i >= 0 ? i : 0;
}
function ansText(q){ return q.options[ansIdx(q)] }
function stars(rate){ return rate >= 1 ? 3 : rate >= .8 ? 2 : rate >= .6 ? 1 : 0 }
function starStr(n){ return '★'.repeat(n) + '☆'.repeat(3 - n) }
function unlocked(u, no){
  if (key(u,no) === '1-1') return true;
  const ls = levelsOf(u);
  const i = ls.findIndex(l => l.no === no);
  if (i === 0) return (S.stars[key(u-1, 99)] || S.stars[key(u-1, 6)] || 0) >= 2;
  const prev = ls[i-1];
  return (S.stars[key(u, prev.no)] || 0) >= 2;
}
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]] } return a }

/* ---------- 视图 ---------- */
const app = document.getElementById('app');
function go(hash){ location.hash = hash; render() }
function render(){
  const h = location.hash.replace(/^#/, '') || 'map';
  if (h.startsWith('quiz/')){ const [u,no] = h.split('/').slice(1).map(Number); return renderQuiz(u,no) }
  if (h.startsWith('res/')){ const [u,no] = h.split('/').slice(1).map(Number); return renderResult(u,no) }
  if (h === 'badges') return renderBadges();
  if (h === 'wrong') return renderWrong();
  if (h === 'stats') return renderStats();
  return renderMap();
}
window.addEventListener('hashchange', render);

function tabbar(cur){
  return `<div class="tabs">
    <div class="tab ${cur==='map'?'on':''}" onclick="go('map')">🗺️ 闯关</div>
    <div class="tab ${cur==='badges'?'on':''}" onclick="go('badges')">🏅 徽章</div>
    <div class="tab ${cur==='wrong'?'on':''}" onclick="go('wrong')">🧹 错题本</div>
    <div class="tab ${cur==='stats'?'on':''}" onclick="go('stats')">📊 成绩</div>
  </div>`;
}

function renderMap(){
  let html = `<h1>🏰 英语闯关</h1><div class="sub">人教版 PEP · 三年级上册 · 共 ${UNITS.length} 个岛</div>` + tabbar('map');
  UNITS.forEach(U => {
    const ls = levelsOf(U.unit);
    const tot = ls.reduce((s,l) => s + (S.stars[key(U.unit,l.no)] || 0), 0);
    const full = ls.reduce((s,l) => s + 3, 0);
    html += `<div class="card"><div class="island"><div class="ico">${['🏝️','🏞️','🦁','🌳','🌈','🎂'][U.unit-1]}</div>
      <div><div class="t1">Unit ${U.unit} · ${U.cn}</div><div class="t2">${U.name} · ⭐ ${tot}/${full}</div></div></div>
      <div class="levels">`;
    ls.forEach(l => {
      const open = unlocked(U.unit, l.no), st = S.stars[key(U.unit,l.no)] || 0;
      const cls = 'lv' + (open ? (st >= 2 ? ' done' : '') : ' lock') + (l.no === 6 ? ' boss' : '') + (l.kind === 'listen' ? ' listen' : '');
      const label = l.kind === 'listen' ? '🎧 ' + l.name : (l.no === 6 ? '🐲 ' + l.name : l.name);
      html += `<div class="${cls}" onclick="${open ? `go('quiz/${U.unit}/${l.no}')` : `alert('先把前一关打到 2 颗星，下一关才会打开哦～')`}">
        ${l.no === 6 || l.kind === 'listen' ? '' : `<div class="n">${l.no}</div>`}
        <div class="nm">${open ? label : '🔒 未解锁'}</div>
        <div class="st">${open ? starStr(st) : ''}</div></div>`;
    });
    html += `</div></div>`;
  });
  app.innerHTML = html;
}

/* ----- 答题 ----- */
let Q = null;
function renderQuiz(u, no){
  const qs = shuffle(questionsOf(u, no));
  Q = { u, no, qs, i: 0, right: 0, wrongIds: [] };
  paint();
}
function paint(){
  const { u, no, qs, i } = Q, q = qs[i];
  const pct = Math.round(i / qs.length * 100);
  let body = '';
  if (q.type === 'listen_word' || q.type === 'listen_meaning' || q.audio){
    body = `<button class="play" onclick="playAudio('${q.audio}')">🔊 点这里听录音（可重复听）</button>
            <div style="height:16px"></div>`;
  }
  const judge = q.options.length === 2 && q.options[0] === '对';
  body += `<div class="opts">` + q.options.map((o, k) =>
    `<div class="opt" id="o${k}" onclick="answer(${k})"><span class="k">${judge ? (k === 0 ? '✓' : '✗') : 'ABC'[k]}</span><span>${esc(o)}</span></div>`).join('') + `</div>
    <div class="tip" id="tip"></div>
    <button class="big" id="next" style="display:none" onclick="nextQ()">下一题 →</button>`;
  app.innerHTML = `<div class="top"><button class="btn-back" onclick="go('map')">← 退出</button>
      <div class="bar"><i style="width:${pct}%"></i></div><div class="cnt">${i+1}/${qs.length}</div></div>
    <div class="card"><div class="qtag">Unit ${u} · ${no === 99 ? '🎧 听力关' : '第 ' + no + ' 关'}</div>
    <div class="stem">${esc(q.stem)}</div>${body}</div>`;
  if (q.audio) setTimeout(() => playAudio(q.audio), 350);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }
let AC = null;
function playAudio(src){
  try{ if(AC) AC.pause() }catch(e){}
  AC = new Audio(src);
  AC.play().catch(() => {});
}
function answer(k){
  const q = Q.qs[Q.i], right = ansIdx(q);
  if (Q.answered) return;
  Q.answered = true;
  document.querySelectorAll('.opt').forEach((el, j) => {
    if (j === right) el.classList.add('right');
    else if (j === k) el.classList.add('wrong');
    else el.classList.add('dim');
  });
  const tip = document.getElementById('tip');
  tip.style.display = 'block';
  if (k === right){ Q.right++; tip.className = 'tip ok'; tip.innerHTML = '✅ 答对啦！' + (q.explain ? '<br>' + esc(q.explain) : ''); }
  else { Q.wrongIds.push(q.id); tip.className = 'tip no';
         const lab = (q.answer === '对' || q.answer === '错') ? q.answer : q.answer + '．' + esc(ansText(q));
         tip.innerHTML = `❌ 再想想～ 正确答案是 <b>${lab}</b>` + (q.explain ? '<br>' + esc(q.explain) : ''); }
  const b = document.getElementById('next');
  b.style.display = 'block';
  b.textContent = Q.i + 1 >= Q.qs.length ? '看结果 →' : '下一题 →';
}
function nextQ(){
  Q.answered = false;
  if (++Q.i >= Q.qs.length){ finish(); return }
  paint();
}
function finish(){
  const rate = Q.right / Q.qs.length, st = stars(rate), k = key(Q.u, Q.no);
  if (st > (S.stars[k] || 0)) S.stars[k] = st;
  Q.wrongIds.forEach(id => { S.wrong[id] = 1 });
  const ls = levelsOf(Q.u);
  if (ls.every(l => (S.stars[key(Q.u,l.no)] || 0) >= 2)) grant('b_u' + Q.u);
  if (ls.some(l => l.kind === 'listen' && (S.stars[key(Q.u, l.no)] || 0) >= 2)) grant('b_listen');
  if (st === 3) grant('b_perfect');
  if (Object.keys(S.wrong).length === 0) grant('b_fixall');
  if (UNITS.every(U => levelsOf(U.unit).every(l => (S.stars[key(U.unit,l.no)] || 0) >= 2))) grant('b_all');
  const today = new Date().toISOString().slice(0, 10);
  if (!S.days.includes(today)){ S.days.push(today); if (S.days.length >= 7) grant('b_streak') }
  S.last = { u: Q.u, no: Q.no, rate, st };
  save();
  go(`res/${Q.u}/${Q.no}`);
}
function renderResult(u, no){
  const last = S.last || {};
  const rate = last.u === u && last.no === no ? last.rate : (S.stars[key(u,no)] || 0) / 3;
  const st = last.u === u && last.no === no ? last.st : (S.stars[key(u,no)] || 0);
  const qs = questionsOf(u, no);
  const wrongs = qs.filter(q => S.wrong[q.id]);
  app.innerHTML = `<div class="card" style="text-align:center">
      <div style="font-size:15px;color:#7b8794">Unit ${u} · ${no === 99 ? '听力关' : '第 ' + no + ' 关'}</div>
      <div class="stars">${starStr(st)}</div>
      <div class="rate">${last.u === u && last.no === no ? `答对 ${Math.round(rate * qs.length)} / ${qs.length} 题（${Math.round(rate * 100)}%）` : '再来一次试试看'}</div>
      ${st >= 2 ? '<div style="color:#1e7a4b;font-weight:700;margin-top:6px">🎉 通关！下一关已解锁</div>' : '<div style="color:#a33;margin-top:6px">正确率到 80% 才能通关哦</div>'}
    </div>
    ${wrongs.length ? `<div class="card"><b>这些题要多练练：</b><div class="wrongbox">` +
      wrongs.map(q => `• ${esc(q.stem)}　<b>${esc(ansText(q))}</b><br><span style="color:#8390a0;font-size:13px">${esc(q.explain || '')}</span>`).join('<br>') + `</div></div>` : ''}
    <button class="big" onclick="go('quiz/${u}/${no}')">🔁 再玩一次</button>
    <button class="big gray" onclick="go('map')">🗺️ 回到地图</button>`;
}
function renderBadges(){
  app.innerHTML = `<h1>🏅 我的徽章</h1><div class="sub">已点亮 ${S.badges.length} / ${BADGES.length}</div>` + tabbar('badges') +
    `<div class="card"><div class="badges">` + BADGES.map(b =>
      `<div class="bd ${S.badges.includes(b.id) ? 'on' : ''}"><span class="i">${b.i}</span>${b.n}</div>`).join('') + `</div></div>`;
}
function renderWrong(){
  const ids = Object.keys(S.wrong);
  let html = `<h1>🧹 错题本</h1><div class="sub">共 ${ids.length} 个错题</div>` + tabbar('wrong');
  if (!ids.length){ html += `<div class="card"><div class="muted">太棒了，没有错题！</div></div>` }
  else {
    const all = UNITS.flatMap(U => U.questions).concat(LISTEN.flatMap(L => L.questions));
    const list = all.filter(q => S.wrong[q.id]);
    html += `<div class="card">` + list.map(q => {
      const L = (LISTEN.flatMap(x => x.questions).includes(q)) ? '🎧 ' : '';
      return `<div class="row"><div style="flex:1;min-width:0">${L}${esc(q.stem)}<br>
        <span style="color:#1e7a4b">✔ ${esc(ansText(q))}</span>
        <span style="color:#8390a0;font-size:12px"> ${esc(q.explain || '')}</span></div>
        <div style="cursor:pointer;color:#5b9dff;padding-left:8px" onclick="delWrong('${q.id}')">已掌握</div></div>`;
    }).join('') + `</div>`;
  }
  app.innerHTML = html;
}
function delWrong(id){ delete S.wrong[id]; if (!Object.keys(S.wrong).length) grant('b_fixall'); save(); renderWrong() }
function renderStats(){
  let html = `<h1>📊 成绩</h1><div class="sub">给家长看的（存在这台手机上）</div>` + tabbar('stats');
  let tot = 0, got = 0;
  UNITS.forEach(U => {
    const ls = levelsOf(U.unit);
    const rows = ls.map(l => {
      const st = S.stars[key(U.unit,l.no)] || 0; tot += 3; got += st;
      return `<div class="row"><span>${l.no === 99 ? '🎧 ' + l.name : (l.no === 6 ? '🐲 ' : '第 ' + l.no + ' 关 ') + l.name}</span>
              <span style="color:${st>=2?'#1e7a4b':'#98a2b3'}">${st ? starStr(st) : '未通关'}</span></div>`;
    }).join('');
    html += `<div class="card"><div class="island"><div class="ico">${['🏝️','🏞️','🦁','🌳','🌈','🎂'][U.unit-1]}</div>
      <div><div class="t1">Unit ${U.unit} · ${U.cn}</div></div></div>${rows}</div>`;
  });
  html += `<div class="card"><div class="row"><b>总得分</b><b>${got} / ${tot} ⭐</b></div>
    <div class="row"><span>已点亮徽章</span><span>${S.badges.length} / ${BADGES.length}</span></div>
    <div class="row"><span>累计练习天数</span><span>${S.days.length} 天</span></div></div>
    <button class="big gray" onclick="resetAll()">清空进度（重新开始）</button>`;
  app.innerHTML = html;
}
function resetAll(){ if (confirm('确定清空所有闯关记录？')){ localStorage.removeItem(KEY); S = load(); S.stars = {}; S.badges = []; S.wrong = {}; S.days = []; renderMap() } }

render();
</script>
</body>
</html>
